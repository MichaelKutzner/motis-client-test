openapi: 3.1.0
info:
  title: Sandbox API
  description: Demo API
  version: v1
externalDocs:
  description: Find out more about MOTIS
  url: https://github.com/motis-project/motis
servers:
  - url: http://localhost:8080
    description: Demo Server (maybe not needed?)
paths:
  /echo:
    post:
      summary: Echo posted object
      description: Echo posted object
      requestBody:
        description: Data to echo
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyObject'
      responses:
        '200':
          description: Echo object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyObject'

components:
  schemas:
    MyObject:
      description: Echoable object
      properties:
        id:
          type: integer
        value:
          type: string
        feature:
          # oneOf:
          #   - $ref: '#/components/schemas/MyLeft'
          #   - $ref: '#/components/schemas/MyRight'
          # discriminator:
          #   propertyName: eitherType
          $ref: '#/components/schemas/MyEither'
    MyEither:
      oneOf:
      # anyOf:
        - $ref: '#/components/schemas/MyLeft'
        - $ref: '#/components/schemas/MyRight'
      discriminator:
        propertyName: eitherType
    MyLeft:
      type: object
      required:
        - eitherType
      properties:
        left:
          type: string
        value:
          type: number
        eitherType:
          type: string
    MyRight:
      type: object
      # required:
      #   - eitherType
      properties:
        right:
          type: string
        value:
          type: string
        eitherType:
          type: string

